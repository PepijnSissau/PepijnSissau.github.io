<!DOCTYPE html> 
<html lang="nl"> 
<head> 
	<title>Opdracht colorpicker</title>
	<link rel="stylesheet" href="styles/styles.css">
</head> 
<body>
	<script src="scripts/code.js"></script>
	<div class="picker">
		<div class="content">
			<div class="div1">
				<span>0<input type="range" class="sliderRed" value="50" min="0" max="255">255</span>
				<span id="redText">Red</span>
				<span id="redValue">50</span>
			</div>
			<div class="div2">
				<span>0<input type="range" class="sliderGreen" value="50" min="0" max="255">255</span>
				<span id="greenText">Green</span>
				<span id="greenValue">50</span>
			</div>
			<div class="div3">
				<span>0<input type="range" class="sliderBlue" value="50" min="0" max="255">255</span>
				<span id="blueText">Blue</span>
				<span id="blueValue">50</span>
			</div>
		</div>
		<div class="colorDemo"></div>
	</div>
</body> 
</html>
