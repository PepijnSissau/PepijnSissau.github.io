<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <script src="./scripts/script.js"></script>
    <table>
        <thead>
        <tr>
            <th>producten</th>
            <th>prijs</th>
            <th>aantal</th>
            <th>btw</th>
            <th>subtotaal</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>product1</td>
            <td class="prijs" data-prijs="10.00">10.00 Eur</td>
            <td><input type="number" class="aantal" min="0" value="0"></td>
            <td class="btw" data-btw="0.06">6%</td>
            <td class="subtotaal">0.00 Eur</td>
        </tr>
        <tr>
            <td>product2</td>
            <td class="prijs" data-prijs="15.00">15.00 Eur</td>
            <td><input type="number" class="aantal" min="0" value="0"></td>
            <td class="btw" data-btw="0.21">21%</td>
            <td class="subtotaal">0.00 Eur</td>
        </tr>
        <tr>
            <td>product3</td>
            <td class="prijs" data-prijs="12.20">12.20 Eur</td>
            <td><input type="number" class="aantal" min="0" value="0"></td>
            <td class="btw" data-btw="0.21">21%</td>
            <td class="subtotaal">0.00 Eur</td>
        </tr>
        <tr>
            <td colspan="4">totaal</td>
            <td id="totaal">0.00 Eur</td>
        </tr>
        </tbody>
    </table>
    <input type="button" id="btnHerberekenen" value="Herbereken">
</body>
</html>
