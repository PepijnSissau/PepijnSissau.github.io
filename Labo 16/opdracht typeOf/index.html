<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <script src="./scripts/script.js"></script>
    <form action="#" method="post">
        <!-- Persoonlijke informatie -->
        <fieldset>
            <legend>Persoonlijke informatie</legend>
            <div class="row">
                <label for="voornaam">Voornaam*:</label>
                <input type="text" id="voornaam" name="voornaam" placeholder="Your first name" required autofocus>
            </div>
            <div class="row">
                <label for="familienaam">Familienaam*:</label>
                <input type="text" id="familienaam" name="familienaam" placeholder="Your last name" required>
            </div>
        </fieldset>

        <!-- Sport -->
        <fieldset>
            <legend>Sport</legend>
            <p class="question">Welke sport beoefen je?</p>
            <div class="option">
                <input type="checkbox" id="lopen" name="sport" value="lopen">
                <label for="lopen">Lopen</label>
            </div>
            <div class="option">
                <input type="checkbox" id="zwemmen" name="sport" value="zwemmen">
                <label for="zwemmen">Zwemmen</label>
            </div>
            <div class="option">
                <input type="checkbox" id="roeien" name="sport" value="roeien">
                <label for="roeien">Roeien</label>
            </div>
        </fieldset>

        <!-- Communicatievoorkeur -->
        <fieldset>
            <legend>Communicatievoorkeur</legend>
            <p class="question">Hoe kunnen we je bereiken?</p>
            <div class="option">
                <input type="radio" id="post" name="contact" value="post">
                <label for="post">Per post</label>
            </div>
            <div class="option">
                <input type="radio" id="mail" name="contact" value="mail">
                <label for="mail">E-mail</label>
            </div>
        </fieldset>

        <!-- Favorieten -->
        <fieldset>
            <legend>Favorieten</legend>
            <div class="row">
                <label for="film">Favoriete film:</label>
                <input type="text" id="film" name="film">
            </div>
            <div class="row">
                <label for="quote">Favoriete quote:</label>
                <input type="text" id="quote" name="quote" placeholder="Schrijf je favoriete quote">
            </div>
            <div class="row">
                <label for="eten">Favoriete eten:</label>
                <select id="eten" name="eten" multiple size="3">
                    <option value="hamburger">Hamburger</option>
                    <option value="hot-dog">Hot-dog</option>
                    <option value="pizza">Pizza</option>
                </select>
            </div>
            <div class="row">
                <label for="browser">Favoriete browser:</label>
                <input type="text" id="browser" name="browser">
            </div>
        </fieldset>

        <!-- Beveiliging & contact -->
        <fieldset>
            <legend>Beveiliging &amp; contact</legend>
            <div class="row">
                <label for="wachtwoord">Wachtwoord*:</label>
                <input type="password" id="wachtwoord" name="wachtwoord" required>
            </div>
            <div class="row">
                <label for="email">E-mailadres:</label>
                <input type="email" id="email" name="email" placeholder="Geef je e-mailadres in">
            </div>
            <div class="row">
                <label for="site">Favoriete site:</label>
                <input type="url" id="site" name="site" placeholder="Geef de URL van je favoriete site">
            </div>
        </fieldset>

        <!-- Extra informatie -->
        <fieldset>
            <legend>Extra informatie</legend>
            <div class="row">
                <label for="getal10">Favoriete getal tussen 1-10:</label>
                <input type="number" id="getal10" name="getal10" min="1" max="10">
            </div>
            <div class="row">
                <label for="getal1000">Favoriete getal tussen 11-1000:</label>
                <input type="range" id="getal1000" name="getal1000" min="11" max="1000">
            </div>
            <div class="row">
                <label for="geboren">Wanneer ben je geboren?</label>
                <input type="date" id="geboren" name="geboren">
            </div>
            <div class="row">
                <label for="postcode">Belgische postcode*:</label>
                <input type="text" id="postcode" name="postcode" placeholder="9999" pattern="[0-9]{4}" required>
            </div>
        </fieldset>

        <!-- Varia -->
        <fieldset>
            <legend>Varia</legend>
            <div class="row">
                <label for="zoeken">Zoeken naar iets:</label>
                <input type="search" id="zoeken" name="zoeken">
            </div>
            <div class="row">
                <label for="kleur">Wat is je lievelingskleur?</label>
                <input type="color" id="kleur" name="kleur">
            </div>
            <div class="row">
                <label for="bestand">Bestand:</label>
                <input type="file" id="bestand" name="bestand">
            </div>
        </fieldset>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</body>
</html>
